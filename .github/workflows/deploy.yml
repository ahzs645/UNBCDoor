name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # The UNBC brand kit is a submodule (ahzs645/unbc-logo) and the build imports from it.
        submodules: recursive
        # That repository is private, and the default GITHUB_TOKEN is scoped to this repository
        # only, so it cannot clone it. SUBMODULE_TOKEN must be a PAT with `repo` scope, added
        # under Settings → Secrets and variables → Actions. Once unbc-logo is public, the
        # fallback to github.token is enough and the secret can be removed.
        token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4